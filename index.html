<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#070b14;--sf:#0e1524;--ink:#e8eefc;--mu:#8f9bb5;--ln:#1f2a44;--ac:#5fe08a;--ai:#04130a;--as:#12301f;--bd:#0b1a33;--ok:#5fe08a;--bad:#ff7b84;--d:'Familjen Grotesk',system-ui,sans-serif;--b:'IBM Plex Sans',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef1ee;--sf:#fbfcfb;--ink:#17201c;--mu:#59665f;--ln:#cfd8d2;--ac:#1d7a3a;--ai:#fff;--as:#dff1e5;--bd:#1f4a3c;--ok:#1d6b3a;--bad:#a3262a;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--b);padding:0 max(16px,env(safe-area-inset-left,0px))}
.w{max-width:1080px;margin:0 auto}h1,h2,h3{font-family:var(--d);line-height:1.15;margin:0}p{margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);margin:0 -16px;padding:10px 16px}
header .w{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font:700 1.3rem var(--d);display:flex;gap:8px;align-items:center}.logo i{width:24px;height:24px;background:var(--bd);border-radius:3px;border:2px solid var(--ac)}
.logo img{height:44px;width:44px;display:block;border-radius:50%;background:#fff;flex:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.tab{border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--mu);font-weight:500;font-size:.9rem}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:6px 10px;font-size:.85rem}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{background:var(--bd);color:#e8f3ee;border-radius:12px;padding:28px;margin:20px 0}.hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}.hero p{margin-top:10px;max-width:60ch;opacity:.9}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:14px}.bar b{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:18px}
.mod{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:10px 12px;margin-bottom:8px}.mod[aria-current=true]{border-color:var(--ac);background:var(--as)}.mod:disabled{opacity:.55;cursor:not-allowed}
.mod small{display:block;color:var(--mu)}
.eb{font:500 .75rem monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.st{border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:4px 12px;font-size:.85rem}.st[aria-current=true]{background:var(--ac);color:var(--ai);border-color:var(--ac)}.st.dn{border-color:var(--ok);color:var(--ok)}.st:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--ac);color:var(--ai);border:0;border-radius:8px;padding:9px 16px;font-weight:600;margin-top:14px}.btn.g{background:none;color:var(--ink);border:1px solid var(--ln)}
.opt{display:block;border:1px solid var(--ln);border-radius:8px;padding:9px 12px;margin-top:8px;cursor:pointer}.opt:has(input:checked){border-color:var(--ac);background:var(--as)}
.fb{margin-top:10px;font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.tg{display:inline-block;border:1px solid var(--ln);border-radius:5px;padding:1px 8px;font-size:.78rem;color:var(--mu);margin:0 6px 6px 0}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tr{text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:16px}.tr:hover{border-color:var(--ac)}
ol.r li{margin-bottom:10px}footer{color:var(--mu);font-size:.85rem;padding:24px 0}

.vis{margin:14px 0 0;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}.vis figcaption{font-size:.85rem;color:var(--mu);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip.on{border-color:var(--ac);background:var(--as)}
.tdone{border-color:var(--ok)}.tlog li{margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}.fan{animation:spin 1s linear infinite}@media(prefers-reduced-motion:reduce){.fan{animation:none}}
.pl{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--sf);margin-top:14px}.pl .scn{padding:14px 18px;min-height:112px}.pl .scn b{font-family:var(--d);font-size:1.15rem}
.pl .cl{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--ln);flex-wrap:wrap}.pl .cl .chip{padding:5px 10px}
.pg{height:5px;background:var(--ln)}.pg i{display:block;height:100%;background:var(--ac)}.pg i.go{animation:pgr 6s linear forwards}@keyframes pgr{from{width:0}to{width:100%}}
.dots{display:flex;gap:6px;margin-left:auto}.dots button{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);background:none;padding:0}.dots button.on{background:var(--ac);border-color:var(--ac)}
.pl svg{animation:fadeIn .5s}@keyframes fadeIn{from{opacity:.3}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pl svg,.pg i.go{animation:none}}

/* ---- v2: navigation ---- */
.tab{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:44px;font-size:.95rem}
.tab[aria-current=true]{background:var(--ac);color:var(--ai);box-shadow:none}.tab .ti{font-size:1.1rem;line-height:1}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 0;font-size:.9rem;color:var(--mu)}
.crumb button{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:6px 12px;font-weight:600;min-height:36px}.crumb b{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:760px){header .tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;flex-wrap:nowrap;gap:2px}
.tab{flex-direction:column;gap:0;font-size:.72rem;padding:4px 2px;flex:1;justify-content:center;min-height:52px}.tab .ti{font-size:1.3rem}body{padding-bottom:88px}.sg>.card{order:-1}}
/* ---- v2: video ---- */
.vf{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin-top:12px}
.vf iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vf.nov{display:flex;align-items:center;justify-content:center;text-align:center;color:#e8f3ee;background:var(--bd);padding:16px}
.vn{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.vn .btn{margin-top:0}
.vl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.vl input{flex:1;min-width:200px;font:inherit;padding:9px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
.vl .btn{margin-top:0}
/* ---- v2: 3D lab ---- */
.sc3{height:330px;perspective:1100px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border:1px solid var(--ln);border-radius:10px;background:radial-gradient(circle at 50% 40%,var(--sf),var(--bg));overflow:hidden;position:relative}
.sc3:active{cursor:grabbing}
.world{position:relative;width:0;height:0;transform-style:preserve-3d}
.bx,.sp{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.bx:not(.pt){pointer-events:none}
.bx i{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;font:600 10px/1.2 var(--b);font-style:normal;color:#fff;text-align:center;border:1px solid rgba(0,0,0,.5);box-sizing:border-box;backface-visibility:visible}
.bx.pt i{cursor:pointer;box-shadow:inset 0 0 12px 3px rgba(255,170,90,.9)}.bx.pt:hover i{filter:brightness(1.25)}
.bx.ts i{box-shadow:inset 0 0 12px 3px rgba(80,220,130,.95)}
.sp.spin{animation:spx 1.1s linear infinite}@keyframes spx{to{transform:rotateX(360deg)}}
@media(prefers-reduced-motion:reduce){.sp.spin{animation:none}}
.scr{padding:4px;font-size:12px;line-height:1.3}
.vwb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}.vwb .chip{min-height:40px}
.vf.vt{display:block;background:var(--bd);text-decoration:none}.vf.vt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf .pb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;padding-left:5px;transition:background .15s}
.vf.vt:hover .pb,.vf.vt:focus-visible .pb{background:#d00}
.vf .yl{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.75);color:#fff;font-size:.85rem;font-weight:600;padding:4px 10px;border-radius:6px}

<script>
const STG=[["Elicit","Activate what you already know"],["Engage","Hook: a real problem"],["Explore","Hands-on investigation"],["Explain","Concepts and vocabulary"],["Elaborate","Apply it to a new task"],["Evaluate","Check your understanding"],["Extend","Take it beyond class"]];
const LV=[["Level 1","Troubleshooting foundations",[
{t:"The troubleshooting method and safety",c:"Follow a safe, step-by-step method to find faults",
s:["Think of the last time a device failed on you. What did you try first, and did you try things in a sensible order?","A lab PC won’t turn on. One student swaps three parts at once and it still fails. Why is changing many things at once a poor idea?","Practice on a case card: write the symptom, make one guess, test only that guess, and note the result before trying anything else.","Method: identify the problem, form a theory, test it, plan the fix, verify full function, document. Change one thing at a time. Unplug power, wear a wrist strap against ESD, and never open a PSU.","Turn the six steps into a one-page flowchart you could pin at a workbench, with a safety check before step one.","Walk a family member through the method on a real household fault, such as a slow laptop, and record what you found."],
q:["Why change only one thing at a time?",["It looks neater","You can tell which change fixed or caused the fault","It saves electricity","Parts last longer"],1]},
{t:"Gathering symptoms",c:"Collect accurate information before touching the device",
s:["A user says “my computer is broken.” List five questions that would make that statement useful.","Two PCs both “won’t start.” One is silent and dark, the other beeps three times. Are they the same problem?","Interview a classmate playing the user: when did it start, what changed, any error text, any noises, does it happen every time? Record the answers.","Useful clues are error messages, LED and fan behavior, beep codes, recent changes, and whether the fault repeats. During POST, beep patterns report hardware faults, and their meaning depends on the BIOS maker.","Create a symptom intake form with fields for user, device, symptom, recent changes, error text, and what was already tried.","Note the exact wording of an error on a real fault at home, then search it on the maker’s support site."],
q:["What should you do before touching a faulty PC?",["Replace the RAM","Ask what changed and gather symptoms","Reinstall the OS","Open the PSU"],1]}]],
["Level 2","Hardware faults",[
{t:"Power and no-boot faults",c:"Diagnose power failures and PCs that will not start",
s:["A PC shows no lights at all. Sketch how power travels from the wall to the motherboard.","Before opening the case, what is the cheapest, fastest thing to check on a PC with no lights?","Trace the chain: outlet, power cord, PSU switch, 24-pin and CPU cables, case power button header. Test each link, easiest first.","Check the outlet, cord, PSU switch and loose connectors first. With a PSU tester or multimeter, +12 V (yellow), +5 V (red) and +3.3 V (orange) should be within about 5 percent. A dead CMOS battery can reset the clock and settings.","Write a decision tree for “no power,” “powers on but no display,” and “shuts off by itself,” with a test at each branch.","Write a short guide for your lab listing five power checks to do before calling a technician."],
q:["What should you check first on a PC with no lights?",["Replace the motherboard","Outlet, power cord and PSU switch","Reinstall Windows","Update drivers"],1]},
{t:"Memory, storage and display faults",c:"Diagnose RAM, drive and display problems",
s:["One PC beeps, another freezes randomly, and another shows a black screen. Which parts might each point to?","A drive makes repeated clicking sounds and files go missing. Should you keep using it while you investigate? Why not?","Reseat RAM one stick at a time, run a memory test, check drive health with SMART, and swap the monitor cable or screen to isolate the display.","Isolate by swapping in known-good parts. Repeated beeps or random crashes often mean RAM. Clicking, slow reads and SMART warnings mean a failing drive, so back up first. No picture while the PC runs points to the cable, monitor or GPU.","Make a symptom-to-cause table for six faults, with the first test and the safest fix for each.","Teach a friend how to back up important files before any repair, and explain why it comes first."],
q:["What should you do first when a drive is clicking and failing?",["Defragment it","Back up the data","Keep using it","Format it"],1]},
{t:"Overheating and peripheral faults",c:"Diagnose heat and input/output device problems",
s:["Why does a laptop get loud and slow after a few hours? Share your guesses.","A PC shuts down only during heavy games. What clue does that timing give you?","Check that fans spin and look for dust, watch temperatures with a utility, then test a keyboard, mouse or printer on another port and another PC.","Heat causes throttling and sudden shutdowns. Clean dust, confirm fans spin, and renew thermal paste if needed. For peripherals, check the cable, port, driver and power, and test on another machine to see which side is faulty.","Design a cleaning and cooling checklist for a lab, with how often each task is done and who signs it off.","Clean a family laptop’s vents safely (powered off, using a soft brush or blower) and compare temperatures before and after."],
q:["A PC shuts down only under heavy load. What is the likely cause?",["Overheating","A bad mouse","Wrong wallpaper","Low volume"],0]}]],
["Level 3","Software and network faults",[
{t:"Operating system and software faults",c:"Diagnose startup errors, slowness and malware",
s:["Describe a time a computer was slow or showed an error message. What did you do?","A PC shows a blue error screen after a new driver was installed. What would you try before wiping the disk?","On a VM, boot to Safe Mode, roll back a driver, use System Restore, check Task Manager for heavy processes, and run an antivirus scan.","Separate hardware from software: if the BIOS and POST work but Windows fails, suspect software. Safe Mode loads minimal drivers, and rollback or restore undoes bad changes. Reinstalling the OS is a last resort, after a backup.","Write an escalation ladder for “PC is slow,” from the quickest safe checks to the most drastic fix.","Show a relative how to check startup programs and free disk space to speed up a sluggish PC."],
q:["Which option is the last resort for a software fault?",["Safe Mode","Driver rollback","Reinstalling the OS","Restart"],2]},
{t:"Network connectivity faults",c:"Diagnose and fix connection problems",
s:["Your phone says “connected, no internet.” What could be wrong, and where?","One PC in the lab can’t browse while the rest can. What does that tell you about where the fault is?","Run ipconfig, ping the gateway, ping 8.8.8.8, then ping a website name, and check the cable, link lights and Wi-Fi signal.","Work outward in layers: cable and link lights, IP address, gateway, then DNS. An address starting with 169.254 means DHCP failed. If pinging an IP works but a name fails, suspect DNS. One PC failing means a local fault.","Build a flowchart from “no internet” to the fix, using each ping result as a decision point.","Map the Wi-Fi dead spots in your home or school with a phone and suggest one fix."],
q:["Ping to an IP works but a website name fails. What is likely?",["Bad cable","DNS problem","Dead PSU","Broken screen"],1]}]],
["Level 4","Professional practice",[
{t:"Preventive maintenance and documentation",c:"Prevent faults and keep useful service records",
s:["What habits keep a bicycle or motorbike from breaking down? Which have a computer equivalent?","The same lab PC fails three times in a month and nobody remembers what was done. What was missing?","Fill in a service log for a practice repair, and set a maintenance calendar for dust cleaning, updates, backups and cable checks.","Preventive maintenance reduces faults: clean, update, back up and inspect. A good service record has the date, symptom, cause, fix, parts used and technician, so patterns show up.","Design a maintenance and log system for a 20-PC lab that a new technician could follow without help.","Review a log of past faults, if you have one, and name the most repeated cause and how to prevent it."],
q:["Why keep a service log?",["To look busy","To spot repeated faults and share what was done","To avoid backups","To skip testing"],1]},
{t:"Mock practical: full cases",c:"Solve complete faults from symptom to documentation",
s:["Which kinds of fault do you feel least ready for? Rate your confidence on power, display, storage, software and network.","You get three tickets at once: a dead PC, a slow PC, and a printer that won’t print. How do you decide the order?","Solve three case cards against the clock: set priorities, follow the six steps, and record every test and result.","Prioritize by safety, impact and ease: hazards first, then faults that block many users, then quick wins. Always verify full function and document before closing a ticket.","Write your own case card with a hidden fault and a marking guide, then swap with a partner to solve.","Compile your best three service reports into a portfolio that shows your troubleshooting skills."],
q:["Which should be handled first?",["Safety hazards","Cosmetic issues","The easiest fault","Whatever came last"],0]}]]];
